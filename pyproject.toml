[build-system]
requires = ["setuptools>=68,<80", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hermes-github-app-plugin"
version = "0.1.0"
description = "Standalone GitHub App connector for Hermes Agent"
requires-python = ">=3.11,<3.14"
dependencies = [
  "PyJWT>=2.8,<3",
  "cryptography>=42,<45",
]

[project.entry-points."hermes_agent.plugins"]
github_app = "github_app:register"

[tool.setuptools]
packages = ["github_app"]

[tool.setuptools.package-data]
github_app = ["plugin.yaml"]
